# Local-only configuration for migration and pgTAP integration tests.
# Production remains linked separately through supabase/.temp/project-ref.
project_id = "stablecoin-policy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "policy"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
