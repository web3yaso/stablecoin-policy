name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund
      - name: Install pinned Quint evaluator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evaluator_download_dir="${RUNNER_TEMP}/quint-evaluator-v0.6.0"
          quint_evaluator_dir="${HOME}/.quint/rust-evaluator-v0.6.0"
          mkdir -p "${evaluator_download_dir}" "${quint_evaluator_dir}"
          gh release download "evaluator/v0.6.0" \
            --repo informalsystems/quint \
            --pattern quint_evaluator-x86_64-unknown-linux-gnu.tar.gz \
            --dir "${evaluator_download_dir}"
          tar -xzf \
            "${evaluator_download_dir}/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" \
            -C "${quint_evaluator_dir}"
          chmod +x "${quint_evaluator_dir}/quint_evaluator"
          test -x "${quint_evaluator_dir}/quint_evaluator"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:phase0
      - run: npm run eval:phase1
      - run: npm run eval:phase2
      - run: npm run eval:phase3
      - run: npm run eval:phase5:deterministic
      - run: npm run eval:phase5:retrieval-rag
      - run: npm run eval:phase5:contract-replay
      - run: npm run eval:phase6
      - run: npm run spec:phase2
      - run: npm run spec:rag
      - run: npm run spec:playbook
      - run: npm run spec:package-impact
      - run: npm run spec:package-watchlist
      - run: npm run spec:change-delta
      - run: npm run spec:change-webhook
      - run: npm run spec:superseding-evaluation
      - run: npm run contracts:citely:fixtures
      - name: Check repository data limits (pull request)
        if: github.event_name == 'pull_request'
        env:
          DATA_DIFF_BASE: origin/${{ github.base_ref }}
          POLICY_STORAGE_CUTOVER: ${{ vars.POLICY_STORAGE_CUTOVER }}
        run: npm run data:check
      - name: Check repository data limits (push)
        if: github.event_name == 'push'
        env:
          POLICY_STORAGE_CUTOVER: ${{ vars.POLICY_STORAGE_CUTOVER }}
        run: npm run data:check
      - run: npm run build

  phase2-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Start isolated Supabase services and apply migrations
        run: npm run db:phase2:start

      - name: Run Phase 2 PostgreSQL transaction tests
        run: npm run test:db:phase2

      - name: Run superseding evaluation concurrency test
        run: npm run test:db:phase2:concurrency

      - name: Stop isolated Supabase services
        if: always()
        run: npm run db:phase2:stop
