name: news-rss

# Polls first-party regulator feeds and structured government APIs, then
# appends versioned official-source items to data/news/summaries.json.
# Continuous monitoring is the default. NEWS_POLL_MAX_DAYS can opt a
# temporary evaluation deployment into a bounded run window.

on:
  schedule:
    # Daily at 03:17 UTC. The OKX.AI ASP sells a *daily* stablecoin policy
    # report, so the refresh must run every day. An off-peak, non-zero
    # minute is deliberate: GitHub's scheduler silently drops workflows
    # queued at congested on-the-hour slots (which killed the previous
    # schedule after 2026-05-18).
    - cron: "17 3 * * *"
  workflow_dispatch: # manual trigger from the Actions tab
    inputs:
      restart:
        description: "Restart NEWS_POLL_MAX_DAYS evaluation window"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency:
      group: news-rss
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the final push can rebase onto the latest main
          # when another push (e.g. a PR merge) lands mid-run.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      - name: Check OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_API_KEY is missing. Add it in GitHub: Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - name: Poll feeds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
          OPENAI_FAST_MODEL: gpt-5.6-luna
          NEWS_POLL_MAX_DAYS: ${{ vars.NEWS_POLL_MAX_DAYS }}
          NEWS_POLL_RESTART: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.restart == 'true' && '1' || '0' }}
          # Optional api.data.gov keys. Federal Register and legislation.gov.uk
          # remain active when these are absent.
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          REGULATIONS_API_KEY: ${{ secrets.REGULATIONS_API_KEY }}
        run: |
          if [[ "$NEWS_POLL_RESTART" == "1" ]]; then
            npx tsx scripts/sync/news-rss.ts --restart
          else
            npx tsx scripts/sync/news-rss.ts
          fi

      - name: Sync public news summaries
        run: cp data/news/summaries.json public/news-summaries.json

      # Regenerates the daily brief and refreshes the sellable
      # global-stablecoin-policy-report in place, including on a quiet poll.
      - name: Generate & publish daily sellable report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
          REPORTS_ENCRYPTION_KEY: ${{ secrets.REPORTS_ENCRYPTION_KEY }}
        run: npx tsx scripts/reports/generate-daily-report.ts

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain data/news/ public/news-summaries.json lib/placeholder-data.ts data/reports/ public/reports/)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news/summaries.json data/news/source-health.json data/news/.rss-started public/news-summaries.json lib/placeholder-data.ts data/reports/index.json data/reports/global-stablecoin-policy-report.md.enc data/reports/daily public/reports/daily
          git commit -m "news+report: daily refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The push can race with another push to main (e.g. a PR merge
          # landing mid-run), which rejects this one as non-fast-forward.
          # Rebase the daily-refresh commit onto the latest main and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main and retrying..."
            git pull --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
          done
          echo "Failed to push after 5 attempts."
          exit 1
